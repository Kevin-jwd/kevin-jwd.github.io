lang: ko-KR
timezone: Asia/Seoul
title: 도재우 | Portfolio
description: 센서·통신·제어를 연결하는 임베디드 SW 프로젝트와 구현 기록입니다.
url: https://kevin-jwd.github.io
baseurl: ""
github:
  username: Kevin-jwd
social:
  name: 도재우
  email: herobine159@naver.com
  links:
    - https://github.com/Kevin-jwd
plugins:
  - jekyll-archives
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
collections:
  tabs:
    output: true
    sort_by: order
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
jekyll-archives:
  enabled: [categories]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/
exclude:
  - docs
  - content
  - tools
  - EDITING.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - "*.gemspec"
  - "*.gem"
  - "*.config.js"
  - "package*.json"
