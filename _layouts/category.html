---
layout: default
---
<div class="hero"><p class="eyebrow">PROJECT CATEGORY</p><h1>{{ page.title | escape }}</h1></div>
{% for project in page.posts %}<a class="project-row" href="{{ project.url | relative_url }}"><span class="project-num">{{ forloop.index }}</span><div><div class="project-title">{{ project.title | escape }}</div><p class="project-summary">{{ project.description | escape }}</p></div><span class="arrow">↗</span></a>{% endfor %}
